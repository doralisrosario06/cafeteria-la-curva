<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login | Cafetería La Curva</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>

<div class="login-page">

    <div class="login-card">

        <div class="login-logo">
            <div class="logo-circle">LC</div>
            <h1>Cafetería La Curva</h1>
            <p>Sistema interno de gestión</p>
        </div>

        {% with mensajes = get_flashed_messages() %}
            {% if mensajes %}
                <div class="alerta">
                    {{ mensajes[0] }}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">

            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" name="usuario" placeholder="Escribe tu usuario" required>

            <label for="clave">Contraseña</label>
            <input type="password" id="clave" name="clave" placeholder="Escribe tu contraseña" required>

            <button type="submit" class="btn-login">
                Iniciar sesión
            </button>

        </form>

     
       

    </div>

</div>

</body>
</html>
